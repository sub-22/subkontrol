[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers"]

[project]
name = "subkontrol"
version = "0.6.0"
description = "morai — AI agent pipeline plugin for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "chromadb>=0.5.0",
    "atlassian-python-api>=3.41.0",
    "slack-sdk>=3.27.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "html2text>=2020.1.16",
    "anyio>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# JSON-handling code uses dict/list without type params — noise not signal
disable_error_code = ["type-arg"]
